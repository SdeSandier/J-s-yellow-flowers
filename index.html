<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flores Amarillas para Josefa</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: radial-gradient(circle at center, #fff6f3 0%, #fbe8e2 60%, #f3d5cd 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      overflow-x: hidden;
      color: #5c3d2e;
      padding: 15px 0;
    }

    .container {
      width: 100%;
      max-width: 620px;
      text-align: center;
      position: relative;
      padding-inline: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* TÍTULO SUPERIOR "PARA TI..." */
    .header-title {
      font-size: 2.1rem;
      font-weight: 700;
      color: #9a3412;
      text-shadow: 0 1px 14px rgba(245, 158, 11, 0.3);
      letter-spacing: 0.8px;
      margin-bottom: 2px;
      opacity: 0;
      transform: translateY(-12px);
      animation: showHeaderTitle 1.2s ease-out 0.2s forwards;
    }

    .scene-svg {
      width: 100%;
      height: auto;
      max-height: 68vh;
      filter: drop-shadow(0 15px 35px rgba(165, 90, 70, 0.18));
    }

    /* ENVOLTORIO Y LAZO */
    .wrap-back {
      opacity: 0;
      transform-origin: 250px 500px;
      animation: popWrap 1.2s cubic-bezier(0.16, 1, 0.3, 1) 0.2s forwards;
    }

    .wrap-front {
      opacity: 0;
      transform-origin: 250px 520px;
      animation: popWrap 1.2s cubic-bezier(0.16, 1, 0.3, 1) 0.4s forwards;
    }

    .ribbon {
      transform-origin: 250px 485px;
      transform: scale(0);
      animation: popScale 0.9s cubic-bezier(0.34, 1.56, 0.64, 1) 1.5s forwards;
    }

    /* TARJETA DEDICATORIA EN EL RAMO */
    .gift-tag-pop {
      transform-origin: 0 0;
      transform: scale(0);
      animation: popScale 0.9s cubic-bezier(0.34, 1.56, 0.64, 1) 1.8s forwards;
    }

    /* TALLOS */
    .stem {
      stroke-dasharray: 480;
      stroke-dashoffset: 480;
      animation: growStem 1.8s cubic-bezier(0.4, 0, 0.2, 1) forwards;
      animation-delay: var(--delay);
    }

    /* FLORES AMARILLAS */
    .layer-back .petal {
      fill: url(#petalGradBack);
      stroke: #a16207;
      stroke-width: 0.9px;
      transform-origin: 0 0;
      transform: scale(0);
      animation: bloomPetal 1.1s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
      animation-delay: calc(var(--delay) + 1.1s);
    }

    .layer-front {
      filter: drop-shadow(0 3px 6px rgba(120, 53, 15, 0.3));
    }

    .layer-front .petal {
      fill: url(#petalGradFront);
      stroke: #ca8a04;
      stroke-width: 0.8px;
      transform-origin: 0 0;
      transform: scale(0);
      animation: bloomPetal 1.1s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
      animation-delay: calc(var(--delay) + 1.4s);
    }

    .center-core {
      transform-origin: 0 0;
      transform: scale(0);
      animation: popScale 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
      animation-delay: calc(var(--delay) + 1.3s);
    }

    /* CABEZAS DE FLORES PEQUEÑAS */
    .filler-head {
      transform-origin: center;
      transform: scale(0);
      animation: popScale 0.9s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
      animation-delay: var(--delay);
    }

    /* GOLDEN RETRIEVER Y PULULOS */
    .dog-pop {
      transform-origin: 0px 70px;
      transform: scale(0);
      animation: popScale 1s cubic-bezier(0.34, 1.56, 0.64, 1) 3.1s forwards;
    }

    .dog-tail {
      transform-origin: -20px 45px;
      animation: wagTail 0.8s ease-in-out infinite alternate;
    }

    .pululos-pop {
      transform-origin: 0px 60px;
      transform: scale(0);
      animation: popScale 1s cubic-bezier(0.34, 1.56, 0.64, 1) 3.4s forwards;
    }

    /* LUCES Y DESTELLOS FLOTANTES */
    .sparkle {
      fill: #f59e0b;
      opacity: 0;
      animation: floatSparkle var(--dur) ease-in-out infinite alternate;
      animation-delay: var(--sp-delay);
    }

    /* DEDICATORIA INFERIOR */
    .card {
      margin-top: 6px;
      opacity: 0;
      transform: translateY(18px);
      animation: showCard 1.4s ease-out 4.8s forwards;
    }

    .card h1 {
      font-size: 1.75rem;
      font-weight: 700;
      color: #9a3412;
      text-shadow: 0 1px 12px rgba(245, 158, 11, 0.25);
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }

    .card p {
      font-size: 1.05rem;
      color: #785241;
      font-weight: 500;
      line-height: 1.4;
    }

    /* KEYFRAMES */
    @keyframes showHeaderTitle {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes growStem {
      to { stroke-dashoffset: 0; }
    }

    @keyframes popScale {
      to { transform: scale(1); }
    }

    @keyframes popWrap {
      0% {
        opacity: 0;
        transform: translateY(20px) scale(0.92);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes bloomPetal {
      0% { transform: scale(0); }
      100% { transform: scale(1); }
    }

    @keyframes wagTail {
      0% { transform: rotate(-10deg); }
      100% { transform: rotate(15deg); }
    }

    @keyframes floatSparkle {
      0% {
        opacity: 0.15;
        transform: translateY(0) scale(0.8);
      }
      50% { opacity: 0.75; }
      100% {
        opacity: 0.2;
        transform: translateY(-20px) scale(1.2);
      }
    }

    @keyframes showCard {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* AJUSTES RESPONSIVOS */
    @media (max-width: 500px) {
      .header-title {
        font-size: 1.75rem;
      }
      .scene-svg {
        max-height: 64vh;
      }
      .card h1 {
        font-size: 1.45rem;
      }
      .card p {
        font-size: 0.95rem;
      }
    }
  </style>
</head>
