<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flores Amarillas</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: radial-gradient(circle at center, #182226 0%, #0c1114 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      overflow: hidden;
      color: #eaeaea;
    }

    .container {
      text-align: center;
      position: relative;
    }

    .flower-svg {
      width: 320px;
      height: 400px;
      filter: drop-shadow(0 12px 30px rgba(245, 158, 11, 0.28));
    }

    /* Animación del tallo */
    .stem {
      stroke-dasharray: 400;
      stroke-dashoffset: 400;
      animation: growStem 2s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    }

    /* Animación de las hojas */
    .leaf {
      transform-origin: 160px 250px;
      transform: scale(0);
      animation: popScale 1s cubic-bezier(0.34, 1.56, 0.64, 1) 1.2s forwards;
    }

    /* Animación de apertura de pétalos */
    .petal {
      transform-origin: 160px 150px;
      transform: scale(0);
      animation: bloomPetal 1.1s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    /* Capa trasera: floración primero (dorado) */
    .layer-back .petal {
      fill: #f59e0b;
      animation-delay: 1.8s;
    }

    /* Capa frontal: florece justo después (amarillo brillante) */
    .layer-front .petal {
      fill: #ffd000;
      animation-delay: 2.1s;
    }

    /* Centro de la flor */
    .center-core {
      transform-origin: 160px 150px;
      transform: scale(0);
      animation: popScale 0.9s cubic-bezier(0.34, 1.56, 0.64, 1) 1.9s forwards;
    }

    /* Mensaje dedicatoria */
    .card {
      margin-top: 15px;
      opacity: 0;
      transform: translateY(15px);
      animation: showText 1.2s ease-out 3s forwards;
      max-width: 90%;
      margin-inline: auto;
    }

    .card h1 {
      font-size: 1.6rem;
      font-weight: 600;
      color: #ffd000;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }

    .card p {
      font-size: 1.05rem;
      color: #cbd5e1;
      line-height: 1.5;
    }

    /* Keyframes */
    @keyframes growStem {
      to { stroke-dashoffset: 0; }
    }

    @keyframes popScale {
      to { transform: scale(1); }
    }

    @keyframes bloomPetal {
      0% {
        transform: scale(0);
      }
      100% {
        transform: scale(1);
      }
    }

    @keyframes showText {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <svg class="flower-svg" viewBox="0 0 320 420">
      <!-- Tallo -->
      <path class="stem" d="M160 150 Q150 270 160 390" fill="none" stroke="#2d6a4f" stroke-width="8" stroke-linecap="round"/>

      <!-- Hojas laterales -->
      <path class="leaf" d="M158 285 C100 275 80 225 105 205 C135 205 155 250 158 285 Z" fill="#387a56"/>
      <path class="leaf" d="M162 250 C220 240 240 190 215 170 C185 170 165 215 162 250 Z" fill="#4ea575"/>

      <!-- Capa trasera de pétalos (12 pétalos, tono ámbar) -->
      <g class="layer-back">
        <g transform="rotate(0 160 150)"><path class="petal" d="M160 145 C138 110 140 60 160 30 C180 60 182 110 160 145 Z"/></g>
        <g transform="rotate(30 160 150)"><path class="petal" d="M160 145 C138 110 140 60 160 30 C180 60 182 110 160 145 Z"/></g>
        <g transform="rotate(60 160 150)"><path class="petal" d="M160 145 C138 110 140 60 160 30 C180 60 182 110 160 145 Z"/></g>
        <g transform="rotate(90 160 150)"><path class="petal" d="M160 145 C138 110 140 60 160 30 C180 60 182 110 160 145 Z"/></g>
        <g transform="rotate(120 160 150)"><path class="petal" d="M160 145 C138 110 140 60 160 30 C180 60 182 110 160 145 Z"/></g>
        <g transform="rotate(150 160 150)"><path class="petal" d="M160 145 C138 110 140 60 160 30 C180 60 182 110 160 145 Z"/></g>
        <g transform="rotate(180 160 150)"><path class="petal" d="M160 145 C138 110 140 60 160 30 C180 60 182 110 160 145 Z"/></g>
        <g transform="rotate(210 160 150)"><path class="petal" d="M160 145 C138 110 140 60 160 30 C180 60 182 110 160 145 Z"/></g>
        <g transform="rotate(240 160 150)"><path class="petal" d="M160 145 C138 110 140 60 160 30 C180 60 182 110 160 145 Z"/></g>
        <g transform="rotate(270 160 150)"><path class="petal" d="M160 145 C138 110 140 60 160 30 C180 60 182 110 160 145 Z"/></g>
        <g transform="rotate(300 160 150)"><path class="petal" d="M160 145 C138 110 140 60 160 30 C180 60 182 110 160 145 Z"/></g>
        <g transform="rotate(330 160 150)"><path class="petal" d="M160 145 C138 110 140 60 160 30 C180 60 182 110 160 145 Z"/></g>
      </g>

      <!-- Capa frontal de pétalos (12 pétalos intercalados a 15°, amarillo brillante) -->
      <g class="layer-front">
        <g transform="rotate(15 160 150)"><path class="petal" d="M160 145 C142 115 144 70 160 42 C176 70 178 115 160 145 Z"/></g>
        <g transform="rotate(45 160 150)"><path class="petal" d="M160 145 C142 115 144 70 160 42 C176 70 178 115 160 145 Z"/></g>
        <g transform="rotate(75 160 150)"><path class="petal" d="M160 145 C142 115 144 70 160 42 C176 70 178 115 160 145 Z"/></g>
        <g transform="rotate(105 160 150)"><path class="petal" d="M160 145 C142 115 144 70 160 42 C176 70 178 115 160 145 Z"/></g>
        <g transform="rotate(135 160 150)"><path class="petal" d="M160 145 C142 115 144 70 160 42 C176 70 178 115 160 145 Z"/></g>
        <g transform="rotate(165 160 150)"><path class="petal" d="M160 145 C142 115 144 70 160 42 C176 70 178 115 160 145 Z"/></g>
        <g transform="rotate(195 160 150)"><path class="petal" d="M160 145 C142 115 144 70 160 42 C176 70 178 115 160 145 Z"/></g>
        <g transform="rotate(225 160 150)"><path class="petal" d="M160 145 C142 115 144 70 160 42 C176 70 178 115 160 145 Z"/></g>
        <g transform="rotate(255 160 150)"><path class="petal" d="M160 145 C142 115 144 70 160 42 C176 70 178 115 160 145 Z"/></g>
        <g transform="rotate(285 160 150)"><path class="petal" d="M160 145 C142 115 144 70 160 42 C176 70 178 115 160 145 Z"/></g>
        <g transform="rotate(315 160 150)"><path class="petal" d="M160 145 C142 115 144 70 160 42 C176 70 178 115 160 145 Z"/></g>
        <g transform="rotate(345 160 150)"><path class="petal" d="M160 145 C142 115 144 70 160 42 C176 70 178 115 160 145 Z"/></g>
      </g>

      <!-- Centro de la flor -->
      <circle class="center-core" cx="160" cy="150" r="35" fill="#583101"/>
      <circle class="center-core" cx="160" cy="150" r="27" fill="#3a1e05"/>
    </svg>

    <div class="card">
      <h1>Feliz 21 de Septiembre</h1>
      <p>Una flor que florece hoy y guardará este momento para siempre.</p>
    </div>
  </div>

</body>
</html>
