<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tus Flores Amarillas</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: radial-gradient(circle at center, #0f1c24 0%, #05080c 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      overflow: hidden;
      color: #eaeaea;
    }

    .container {
      width: 100%;
      max-width: 750px;
      text-align: center;
      position: relative;
      padding-inline: 10px;
    }

    .garden-svg {
      width: 100%;
      height: auto;
      max-height: 70vh;
      filter: drop-shadow(0 10px 30px rgba(245, 158, 11, 0.15));
    }

    /* SISTEMA DE ANIMACIÓN ESCALONADA (Basado en la variable --delay de cada flor) */
    
    /* Crecimiento del tallo */
    .stem {
      stroke-dasharray: 450;
      stroke-dashoffset: 450;
      animation: growStem 2.2s cubic-bezier(0.4, 0, 0.2, 1) forwards;
      animation-delay: var(--delay);
    }

    /* Aparición de hojas */
    .leaf {
      transform-origin: 0px 150px;
      transform: scale(0);
      animation: popScale 1.2s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
      animation-delay: calc(var(--delay) + 1.2s);
    }
    .leaf-right {
      transform-origin: 0px 120px;
    }

    /* Apertura de pétalos (Capa Trasera) */
    .layer-back .petal {
      fill: #eab308;
      transform-origin: 0px 0px;
      transform: scale(0);
      animation: bloomPetal 1.2s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
      animation-delay: calc(var(--delay) + 1.8s);
    }

    /* Apertura de pétalos (Capa Frontal) */
    .layer-front .petal {
      fill: #facc15;
      transform-origin: 0px 0px;
      transform: scale(0);
      animation: bloomPetal 1.2s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
      animation-delay: calc(var(--delay) + 2.1s);
    }

    /* El centro de la flor */
    .center-core {
      transform-origin: 0px 0px;
      transform: scale(0);
      animation: popScale 0.9s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
      animation-delay: calc(var(--delay) + 2.0s);
    }

    /* EFECTO DE POLEN / BRILLOS FLOTANTES */
    .sparkle {
      fill: #fef08a;
      opacity: 0;
      animation: floatSparkle var(--dur) ease-in-out infinite alternate;
      animation-delay: var(--sp-delay);
    }

    /* Tarjeta de Dedicatoria */
    .card {
      margin-top: 5px;
      opacity: 0;
      transform: translateY(20px);
      animation: showCard 1.5s ease-out forwards;
      /* Aparece después de que todas las flores han brotado (F4 termina a los 5.5s) */
      animation-delay: 5.2s;
    }

    .card h1 {
      font-size: 1.8rem;
      font-weight: 700;
      color: #facc15;
      text-shadow: 0 0 15px rgba(250, 204, 21, 0.4);
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }

    .card p {
      font-size: 1.05rem;
      color: #94a3b8;
      line-height: 1.5;
    }

    /* KEYFRAMES */
    @keyframes growStem {
      to { stroke-dashoffset: 0; }
    }

    @keyframes popScale {
      to { transform: scale(1); }
    }

    @keyframes bloomPetal {
      0% { transform: scale(0); }
      100% { transform: scale(1); }
    }

    @keyframes floatSparkle {
      0% {
        opacity: 0.1;
        transform: translateY(0) scale(0.8);
      }
      50% {
        opacity: 0.8;
      }
      100% {
        opacity: 0.2;
        transform: translateY(-25px) scale(1.2);
      }
    }

    @keyframes showCard {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
